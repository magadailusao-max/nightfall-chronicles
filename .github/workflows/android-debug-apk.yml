name: Compilar APK Android nativo
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'assets/**'
      - 'main.tscn'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'ci/**'
      - '.github/workflows/android-debug-apk.yml'

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.ci/android-debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Instalar componentes Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" version
      - name: Preparar assinatura de testes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci build
          keytool -genkeypair -noprompt -v \
            -keystore .ci/android-debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Nightfall,C=BR'
      - name: Importar recursos e configurar Godot
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          godot --headless --path . --import
          python3 ci/configure_editor.py
      - name: Verificar cena e combate no motor real
        shell: bash
        run: godot --headless --path . --script ci/smoke_test.gd
      - name: Exportar APK nativo
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --export-debug 'Android' 'build/Nightfall_Chronicles_Android_Debug.apk'
          test -s build/Nightfall_Chronicles_Android_Debug.apk
      - name: Verificar assinatura e tamanho
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose build/Nightfall_Chronicles_Android_Debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            build/Nightfall_Chronicles_Android_Debug.apk | head -12
          ls -lh build/*.apk
          SIZE=$(stat -c%s build/Nightfall_Chronicles_Android_Debug.apk)
          if [ "$SIZE" -lt 209715200 ]; then echo "ERRO: APK abaixo dos 200 MiB solicitados: $SIZE bytes"; exit 1; fi
      - name: Publicar APK instalável como artefato
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-chronicles-android-debug
          path: build/Nightfall_Chronicles_Android_Debug.apk
          if-no-files-found: error
          retention-days: 30
